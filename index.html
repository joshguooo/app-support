<!DOCTYPE html>

<head>

    <title>App Support Documentation</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
            line-height: 1.6;
        }
        h1 {
            border-bottom: 2px solid #333;
            padding-bottom: 10px;
        }
        .app-section {
            margin: 30px 0;
            padding: 20px;
            border: 1px solid #ddd;
            border-radius: 5px;
        }
        .app-section h2 {
            margin-top: 0;
        }
        .links {
            margin-top: 10px;
        }
        .links a {
            display: inline-block;
            margin-right: 15px;
            color: #0066cc;
            text-decoration: none;
        }
        .links a:hover {
            text-decoration: underline;
        }
    </style>

<body>
    <h1>App Support Documentation</h1>
    <p>Legal documentation and policies for our applications.</p>

    <div class="app-section">
        <h2>Textile</h2>

        <div class="links">
            <a href="/app-support/textile/toc">Terms of Service</a>
            <a href="/app-support/textile/privacy">Privacy Policy</a>

    <!-- Example app - replace with your actual apps -->
